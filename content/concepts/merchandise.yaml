id: merchandise
title: 商品売買
order: 2
concepts:
  - id: merchandise
    name: 商品
    reading: [しょうひん]
    short: 売るために仕入れる物。カフェなら、売り物の豆や焼き菓子
    summary: 会社が売ることを目的に買う物。自分で使う備品や消耗品とは区別し、仕入れてから売るまでの流れを専用の勘定科目で記録する。
    example: カフェが売り物として仕入れるコーヒー豆は商品。店で使うコーヒーマシンは商品ではなく備品。
    requires: [transaction]
    related: [purchase, three_account_method]
    contrasts: []
  - id: three_account_method
    name: 三分法
    reading: [さんぶんぽう]
    short: 商品の売り買いを「仕入」「売上」「繰越商品」の3つの勘定科目で記録する方法
    summary: 商品を買ったら仕入(費用)、売ったら売上(収益)で記録し、決算の日に売れ残った分だけを繰越商品(資産)に移す方法。日々の記帳では売れた商品の仕入値をいちいち調べなくてよい。
    example: 豆を30,000円で仕入れたら仕入30,000、90,000円で売れたら売上90,000。もうけは差額として後で分かる。
    requires: [merchandise, expense, revenue]
    related: [purchase, cost_of_goods_sold, ending_inventory]
    contrasts: []
  - id: purchase
    name: 仕入れ
    reading: [しいれ]
    short: 売るための商品を買うこと。三分法では「仕入」という費用で記録する
    summary: 商品を手に入れる取引。三分法では、買った時点で仕入という費用の勘定科目に記録する。備品のような長く使う物の購入とは違い、資産にはしない。
    example: コーヒー豆30,000円を現金で仕入れたら、左に仕入30,000、右に現金30,000。
    requires: [merchandise, expense]
    related: [three_account_method, accounts_payable, incidental_costs]
    contrasts: []
  - id: credit_transaction
    name: 掛け取引
    reading: [かけとりひき]
    short: 商品を先に渡し、代金は後でまとめて受け払いする約束の取引
    summary: 商品の受け渡しと代金の支払いの時期がずれる取引。売る側は「後で受け取る権利」を売掛金、買う側は「後で払う義務」を買掛金として記録する。お金が動いていなくても、売上や仕入はその場で記録する。
    example: 近所の会社に豆60,000円分を納品し、代金は月末払い。納品の日に売上60,000と売掛金60,000を記録する。
    requires: [transaction, journal_entry]
    related: [accounts_receivable, accounts_payable]
    contrasts: []
  - id: accounts_receivable
    name: 売掛金
    reading: [うりかけきん]
    short: 商品を売って、後で代金を受け取る権利。現金に変わる前の資産
    summary: 掛けで売ったときに生まれる「代金を受け取る権利」。まだお金は入っていないが、将来お金に変わるので資産。回収すると現金や預金に姿を変え、売上はもう一度記録しない。
    example: 掛けで60,000円分を納品すると売掛金が60,000増え、月末に入金されると売掛金が減って預金が増える。
    requires: [credit_transaction, asset]
    related: [accounts_payable, revenue]
    contrasts: [accounts_payable]
  - id: accounts_payable
    name: 買掛金
    reading: [かいかけきん]
    short: 商品を仕入れて、後で代金を払う義務。借入金と同じ負債の仲間
    summary: 掛けで仕入れたときに生まれる「代金を払う義務」。商品はもう受け取っているので仕入はその場で記録し、払う義務を買掛金(負債)として残す。支払うと買掛金が減り、仕入はもう一度記録しない。
    example: 問屋から豆40,000円分を掛けで仕入れると買掛金が40,000増え、月末に払うと買掛金と現金が減る。
    requires: [credit_transaction, liability]
    related: [accounts_receivable, purchase]
    contrasts: [accounts_receivable]
  - id: returns
    name: 返品
    reading: [へんぴん]
    short: 買った商品を返す、または売った商品が戻ってくること。元の仕訳を左右逆にして取り消す
    summary: 品違いや傷みで商品を返す取引。新しい取引ではなく、元の仕入や売上の取り消しなので、元の仕訳を左右逆にした仕訳(逆仕訳)で記録する。掛けなら買掛金や売掛金が減る。
    example: 掛けで仕入れた豆のうち10,000円分を返したら、左に買掛金10,000、右に仕入10,000。
    requires: [purchase, journal_entry]
    related: [incidental_costs]
    contrasts: []
  - id: incidental_costs
    name: 諸掛
    reading: [しょがかり]
    short: 商品の売り買いにかかる運賃などの費用。仕入のときは仕入に含め、売るときは発送費にする
    summary: 商品を仕入れるときの運賃(仕入諸掛)は、商品を手に入れるためにかかった金額なので仕入に含める。売った商品を送る運賃は発送費という別の費用にする。向きで扱いが変わる。
    example: 豆50,000円を仕入れて運賃2,000円を払ったら仕入は52,000円。焼き菓子を送る運賃1,500円は発送費。
    requires: [purchase, expense]
    related: [returns]
    contrasts: []
  - id: cost_of_goods_sold
    name: 売上原価
    reading: [うりあげげんか, げんか]
    short: 売れた商品の仕入値の合計。期首の商品 + 当期の仕入 − 期末の売れ残りで求める
    summary: 1年間に売った商品が、いくらで仕入れた物だったかの合計。三分法では日々は仕入に全部ためておき、決算で期首の商品を仕入に足し、売れ残り(期末の商品)を引いて求める。売上から売上原価を引いた差が商品のもうけ。
    example: 期首の商品が15,000円、1年の仕入が132,000円で、決算の日に22,000円分が売れ残っていたら、売上原価は125,000円。
    requires: [three_account_method, expense]
    related: [ending_inventory]
    contrasts: []
  - id: ending_inventory
    name: 期末商品
    reading: [きまつしょうひん]
    short: 決算の日に売れ残っている商品。繰越商品という資産として次の期に持ち越す
    summary: まだ売れていない商品は、これから売ってお金に変わる財産なので、決算で仕入から取り出して繰越商品(資産)にする。次の期は期首の商品としてその期の仕入と一緒に売っていき、次の期の決算で仕入へ入れてから、その期の売れ残りをまた取り出す。
    example: 決算の日に豆と焼き菓子が22,000円分残っていたら、左に繰越商品22,000、右に仕入22,000。
    requires: [cost_of_goods_sold, asset]
    related: [three_account_method]
    contrasts: []
