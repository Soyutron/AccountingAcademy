# よくある誤解。演習の誤答パターンから参照され、立ち止まり(remediation)の案内先になる
misconceptions:
  - id: debit_means_increase
    name: 借方は常に増加
    description: 「借方 = 増える、貸方 = 減る」と覚えている。資産と費用では正しいが、負債・純資産・収益では逆になる
    correct: 増減の側は要素によって決まる。資産・費用は借方で増え、負債・純資産・収益は貸方で増える
    concepts: [five_elements, debit_credit]
    remediation: bookkeeping-basics/five-elements
  - id: cash_is_only_asset
    name: 資産は現金だけ
    description: 現金や預金だけを資産と考え、建物や備品、売掛金のような形の違う財産を資産とみなしていない
    correct: 資産とは会社が持つ財産や権利の全体。現金が形を変えて建物や備品になっても、資産の合計は変わらない
    concepts: [asset, five_elements]
    remediation: bookkeeping-basics/five-elements
  - id: revenue_equals_cash_in
    name: お金が入れば収益
    description: 現金が入ってくれば収益、出ていけば費用だと思っている。借入による入金を収益と考えてしまう
    correct: 収益は純資産を増やす原因、費用は純資産を減らす原因。借入は返す義務(負債)が同時に増えるので純資産は増えず、収益ではない
    concepts: [revenue, liability, five_elements]
    remediation: bookkeeping-basics/five-elements
  - id: expense_as_liability
    name: 費用と負債の混同
    description: 「支払うもの」という共通点から、費用と負債を同じものだと考えている
    correct: 負債は「将来支払う義務」で貸借対照表に残る。費用は「純資産を減らす原因」で損益計算書に載り、その期で消える
    concepts: [expense, liability]
    remediation: bookkeeping-basics/five-elements
  - id: expense_at_payment
    name: 支払った時に費用
    description: 現金を支払った時点で費用になると思っている。支払いと費用の発生を区別していない
    correct: 費用はお金を払った時ではなく、その効果が発生した期間に計上する(発生主義)。長く使う資産の購入は支払った時点では費用にならない
    concepts: [accrual_basis, cost_allocation]
    remediation: depreciation/what-is-depreciation
  - id: no_cost_allocation
    name: 購入時に全額費用
    description: 長く使う資産の購入額を、買った期の費用に全額計上してしまう
    correct: 使う期間にわたって費用を配分する(費用配分の原則)。購入した期は資産として記録し、各期の減価償却費として少しずつ費用にする
    concepts: [cost_allocation, depreciation]
    remediation: depreciation/what-is-depreciation
  - id: contra_as_liability
    name: 減価償却累計額は負債
    description: 減価償却累計額が貸方に増えることから、負債だと思っている
    correct: 減価償却累計額は資産のマイナスを表す評価勘定。誰かに支払う義務ではないので負債ではなく、貸借対照表では資産から控除して表示する
    concepts: [contra_account, indirect_method]
    remediation: depreciation/what-is-depreciation
  - id: direct_writeoff_vs_contra
    name: 資産を直接減らす
    description: 間接法と指定されているのに、建物や備品の勘定科目を直接減らしてしまう
    correct: 間接法では固定資産の金額は取得原価のまま残し、減った分は減価償却累計額に積み上げる。これで取得原価と減価の累計の両方が読み取れる
    concepts: [indirect_method, contra_account]
    remediation: depreciation/what-is-depreciation
  - id: depreciation_as_cash_outflow
    name: 減価償却費は支払い
    description: 減価償却費を計上するときに現金や預金が減ると思っている
    correct: 現金は資産を買った時点で減っている。減価償却はその支出を各期に配分する手続きであり、お金の動きを伴わない
    concepts: [depreciation, cost_allocation]
    remediation: depreciation/what-is-depreciation
  - id: forgot_monthly_proration
    name: 月割りを忘れる
    description: 期の途中で取得した資産でも、1 年分の減価償却費を計上してしまう
    correct: 使った期間に対応する費用だけを計上する。取得した月から決算月までの月数で 1 年分を按分する
    concepts: [monthly_proration, straight_line_method]
    remediation: depreciation/straight-line
  - id: residual_value_ignored
    name: 残存価額を無視する
    description: 残存価額が与えられているのに、取得原価をそのまま耐用年数で割ってしまう
    correct: 配分するのは取得原価から残存価額を引いた金額。残存価額は使い終わった後に残る価値なので費用にしない
    concepts: [residual_value, straight_line_method]
    remediation: depreciation/straight-line
  - id: purchase_is_asset
    name: 仕入は資産
    description: 売るための商品を買ったとき、備品と同じように資産として記録すると思っている
    correct: 三分法では、商品を買ったときは「仕入」という費用で記録する。売れ残った分だけを決算で繰越商品(資産)に移す
    concepts: [three_account_method, purchase, expense]
    remediation: merchandise/three-account-method
  - id: revenue_only_when_cash
    name: お金を受け取るまで売上ではない
    description: 商品を渡しても、代金を受け取るまでは売上にならないと思っている
    correct: 売上は商品を渡した(サービスを提供した)ときに記録する。代金が後払いなら、受け取る権利を売掛金(資産)として記録する
    concepts: [credit_transaction, receivable, revenue]
    remediation: merchandise/credit-transactions
  - id: receivable_is_cash
    name: 売掛金は現金
    description: 売掛金を、すでに受け取ったお金や売上そのものと混同している
    correct: 売掛金は「後で代金を受け取る権利」で、現金とは別の資産。回収したときに現金や預金に変わる
    concepts: [receivable, asset]
    remediation: merchandise/credit-transactions
  - id: receivable_collection_is_sale
    name: 回収のときにもう一度売上
    description: 売掛金を回収したときに、売上をもう一度記録してしまう
    correct: 売上は商品を渡したときに記録済み。回収では売掛金(資産)が現金や預金(資産)に変わるだけで、売上は増えない
    concepts: [receivable, revenue]
    remediation: merchandise/credit-transactions
  - id: payable_payment_is_purchase
    name: 支払いのときにもう一度仕入
    description: 買掛金を支払ったときに、仕入をもう一度記録してしまう
    correct: 仕入は商品を受け取ったときに記録済み。支払いでは買掛金(負債)が減り、現金(資産)が減るだけで、仕入は増えない
    concepts: [payable, purchase]
    remediation: merchandise/credit-transactions
  - id: return_as_new_transaction
    name: 返品を新しい取引として記録
    description: 返品を、新しい仕入や売上、あるいは別の費用や収益として記録してしまう
    correct: 返品は元の取引を取り消すこと。元の仕訳を左右逆にした仕訳(逆仕訳)で、仕入や売上、買掛金や売掛金を減らす
    concepts: [returns, journal_entry]
    remediation: merchandise/returns-and-costs
  - id: incidental_cost_separate
    name: 仕入の運賃を別の費用にする
    description: 商品を仕入れるときにかかった運賃を、仕入とは別の費用として記録してしまう
    correct: 商品を手に入れるまでにかかった運賃(仕入諸掛)は、商品の値段の一部として仕入に含める
    concepts: [incidental_costs, purchase]
    remediation: merchandise/returns-and-costs
  - id: shipping_in_purchases
    name: 発送費を仕入に含める
    description: 売った商品を送る運賃を、仕入に含めてしまう
    correct: 売るときにかかる運賃は発送費という費用。仕入に含めるのは、仕入れるときにかかった運賃だけ
    concepts: [incidental_costs, expense]
    remediation: merchandise/returns-and-costs
  - id: purchases_equal_cogs
    name: 仕入の合計がそのまま売上原価
    description: 1 年に仕入れた金額の全部が、売った商品の原価だと思っている
    correct: 売れ残った商品の分は、まだ費用ではない。仕入の合計から期末の商品を引いた金額が売上原価で、売れ残りは繰越商品(資産)として次の期に持ち越す
    concepts: [cost_of_goods_sold, ending_inventory]
    remediation: merchandise/cost-of-goods-sold
