name: 不具合
description: 画面の表示や操作、保存などの不具合
labels: ["type:bug", "needs-triage"]
body:
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      description: どの画面で、何をしたら、何が起きたか。URLとステップ番号があると助かります
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待する動作
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: 環境
      placeholder: "例: Chrome 142 / Windows 11 / 画面幅1280px、またはiPhone Safari"
