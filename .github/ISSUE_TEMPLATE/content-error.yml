name: 教材の誤り・分かりにくさ
description: 解説・演習・用語の誤り、分かりにくい説明、採点や誤解の判定への疑問
labels: ["type:content", "area:content", "needs-triage"]
body:
  - type: input
    id: unit
    attributes:
      label: 単元とステップ
      description: 画面のURLか、単元名とステップ番号
      placeholder: "/units/depreciation/straight-lineステップ3"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 何が気になりましたか
      description: 誤っていると思う点、分かりにくかった点、採点に納得できなかった点など。自分の回答と出た結果があれば書いてください
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: こうなっていると分かりやすい(任意)
      description: 正しいと思う内容や、こう説明されたら理解できたという案。出典(会計基準、法令など)があれば添えてください
  - type: checkboxes
    id: rules
    attributes:
      label: 確認
      options:
        - label: 過去問・教科書の文章をそのまま貼っていません
          required: true
